name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-build-test:
    name: Backend Java Compilation & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile and Test Backend Modules
        working-directory: backend
        run: mvn clean test

  ml-service-test:
    name: ML Service & Contract Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ml-service
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Pytest & OpenAPI Contract Validation
        working-directory: ml-service
        run: pytest tests/

  container-build-check:
    name: Container Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ML Service Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/ml-service.Dockerfile
          push: false

      - name: Build Backend Gateway Service Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/backend-service.Dockerfile
          build-args: |
            SERVICE_MODULE=gateway-service
          push: false
