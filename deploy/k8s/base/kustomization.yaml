apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base manifests — no cluster-specific values live here. Overlays under
# ../overlays/{local,staging,prod} patch replicas, image tags, ingress, and
# secret references.

namespace: iapi

resources:
  - namespace.yaml
  - configmap.yaml
  - deployments.yaml
  - services.yaml

commonLabels:
  app.kubernetes.io/part-of: innovations-api
