apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: iapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: iapi/auth-service:latest
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: iapi-config
---
